name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default token permissions for the github-actions[bot]; jobs widen them only where needed.
permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  # GHCR image names must be lowercase (the owner login has uppercase letters)
  IMAGE_NAME: ghcr.io/tuanngo-02/be-auction-platform

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Checkstyle (nohttp)
        run: ./mvnw -ntp --batch-mode checkstyle:check

      # Unit + integration tests; Testcontainers starts PostgreSQL and Redis on the runner's Docker.
      - name: Test and package
        run: >
          ./mvnw -ntp --batch-mode verify -Pprod
          -Dlogging.level.ROOT=OFF
          -Dlogging.level.tech.jhipster=OFF
          -Dlogging.level.com.auction.system=OFF
          -Dlogging.level.org.springframework=OFF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 7

  cd:
    name: Publish Docker image
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # lets github-actions[bot] push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and push image with Jib
        run: >
          ./mvnw -ntp --batch-mode package -Pprod -DskipTests jib:build
          -Djib.to.image=${{ env.IMAGE_NAME }}:latest
          -Djib.to.tags=${{ github.sha }}
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Backend image published" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
